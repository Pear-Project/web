<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 280px;
    padding: 14px;
    background: #fff;
    color: #111;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px;
    color: #444;
  }
  h2 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin: 14px 0 6px;
  }
  .total {
    font-size: 30px;
    font-weight: 700;
    color: #16a34a;
    margin-bottom: 4px;
  }
  .projection {
    font-size: 22px;
    font-weight: 700;
    color: #2563eb;
    margin-bottom: 2px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-top: 12px;
    background: #2563eb;
    color: #fff;
  }
  button:hover {
    background: #1d4ed8;
  }
  button:disabled {
    background: #93c5fd;
    cursor: default;
  }
  .meta {
    font-size: 11px;
    color: #888;
    margin-top: 10px;
    line-height: 1.4;
  }
  .error {
    font-size: 11px;
    color: #dc2626;
    margin-top: 6px;
  }
  hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
  <h1>Ezoic Live Earnings</h1>

  <div class="total" id="total">$0.00</div>
  <div class="row"><span>Revenue in the current chart window</span></div>
  <div id="breakdown"></div>

  <hr />

  <h2>24h Projection</h2>
  <div class="projection" id="projection">—</div>
  <div class="meta" id="windowMeta">Click "Refresh" to compute the projection from the visible chart.</div>

  <button id="refresh">Refresh</button>

  <div class="error" id="error"></div>
  <div class="meta" id="meta"></div>

  <script src="popup.js"></script>
</body>
</html>

name = "pearos-dl"
main = "src/index.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "iso.pearos.xyz/*", zone_name = "pearos.xyz" }
]

[[r2_buckets]]
binding = "ISO_BUCKET"
bucket_name = "pearos-cdn"

[[analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "pearos_downloads"

# Workers Paid: raise the CPU-time budget from Free's fixed 10ms to the max.
# This is what actually fixes the "Exceeded CPU Limit" errors on throttled
# multi-GB downloads -- confirmed via wrangler tail that even the zero-copy,
# 4MB-batched throttleStream still exceeded Free's 10ms cap.
[limits]
cpu_ms = 300000

# Secrets (set via `wrangler secret put`, NOT stored here):
#   HMAC_SECRET      - random string, used to sign/verify download links
#   STRIPE_SECRET_KEY - Stripe secret key, used to verify checkout sessions
#   SMTP_PASSWORD    - password of the mailbox below; without it no confirmation
#                      email is sent (everything else works the same)

[vars]
ALLOWED_ORIGIN = "https://pearos.xyz"
FREE_SPEED_BYTES_PER_SEC = "2097152"   # 2 MB/s
SIGNED_URL_TTL_SECONDS = "14400"       # 4 hours
# Outgoing mail (BSD purchase confirmation) through Namecheap Private Email
SMTP_HOST = "mail.privateemail.com"
SMTP_PORT = "465"
SMTP_USER = "alex@pear-software.com"
MAIL_FROM = "alex@pear-software.com"
MAIL_FROM_NAME = "pearOS"
# Stripe Managed Payments (merchant of record): "off" | "bsd" (BSD sales only; "on" is the
# same) | "all" (BSD sales + the paid full-speed download unlock). Off = our own sale.
MANAGED_PAYMENTS = "all"

[observability]
enabled = true

name: Sync BSD (UltraC0re) download table

# Reads the `iso-latest` release of pearOS-bsd/iso and rewrites assets/data/bsd-versions.json:
# version, size and SHA-256 (of the .iso.xz) per architecture; an architecture without an image
# is listed as "Unavailable". Hourly, so a new build shows up on the site within the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bsd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from the pearOS-bsd/iso release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_bsd_iso.py

      - name: Commit and push if changed
        run: |
          git diff --quiet -- assets/data/bsd-versions.json && { echo "unchanged"; exit 0; }
          git config user.name "pearOS build bot"
          git config user.email "327192259+pear-software@users.noreply.github.com"
          git add assets/data/bsd-versions.json
          git commit -m "Sync BSD download table from pearOS-bsd/iso"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch -q origin main && git rebase -q origin/main
            sleep $((RANDOM % 5 + 1))
          done
          git push origin HEAD:main

name: Sync ISO checksums and sizes

# Daily pull of sha.txt from the two build repos (plus a live HEAD request
# for file size), plus a manual trigger for whenever this needs to be
# re-read on demand instead of waiting for the next midnight run.
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Fetch checksums
        run: |
          # Both sha.txt files are plain `sha256sum` output ("<hash>  <path>"),
          # so the hash is always the first whitespace-separated field
          # regardless of what filename/path follows it.
          nicecore_sha=$(curl -fsSL https://raw.githubusercontent.com/pearos-archlinux/iso/main/sha.txt | awk '{print $1}')
          goldwing_sha=$(curl -fsSL https://raw.githubusercontent.com/Pear-Project/iso/main/sha.txt | awk '{print $1}')

          if [ -z "$nicecore_sha" ]; then
            echo "[ ERR ]: Could not read NiceC0re sha.txt from pearos-archlinux/iso."
            exit 1
          fi
          if [ -z "$goldwing_sha" ]; then
            echo "[ ERR ]: Could not read Goldwing sha.txt from Pear-Project/iso."
            exit 1
          fi

          echo "NiceC0re sha256: $nicecore_sha"
          echo "Goldwing sha256: $goldwing_sha"

          echo "NICECORE_SHA=$nicecore_sha" >> "$GITHUB_ENV"
          echo "GOLDWING_SHA=$goldwing_sha" >> "$GITHUB_ENV"

      - name: Fetch file sizes
        run: |
          # Re-check the size of whatever URL is currently listed for each
          # build -- a plain HEAD request to iso.pearos.xyz, no auth needed
          # (the Worker returns content-length on HEAD regardless of the
          # download being paywalled/throttled for GET).
          nicecore_url=$(jq -r '.[] | select(.name == "NiceC0re") | .download' assets/data/nicecore-versions.json)
          goldwing_url=$(jq -r '.[] | select(.name == "Latest (Goldwing)") | .download' assets/data/debian-versions.json)

          nicecore_bytes=$(curl -fsSLI "$nicecore_url" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-length:/{print $2}' | tail -n1)
          goldwing_bytes=$(curl -fsSLI "$goldwing_url" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-length:/{print $2}' | tail -n1)

          if [ -z "$nicecore_bytes" ]; then
            echo "[ ERR ]: Could not read NiceC0re content-length from $nicecore_url."
            exit 1
          fi
          if [ -z "$goldwing_bytes" ]; then
            echo "[ ERR ]: Could not read Goldwing content-length from $goldwing_url."
            exit 1
          fi

          nicecore_size=$(awk -v b="$nicecore_bytes" 'BEGIN{printf "%.1f GB", b/1000000000}')
          goldwing_size=$(awk -v b="$goldwing_bytes" 'BEGIN{printf "%.1f GB", b/1000000000}')

          echo "NiceC0re size: $nicecore_size ($nicecore_bytes bytes)"
          echo "Goldwing size: $goldwing_size ($goldwing_bytes bytes)"

          echo "NICECORE_SIZE=$nicecore_size" >> "$GITHUB_ENV"
          echo "GOLDWING_SIZE=$goldwing_size" >> "$GITHUB_ENV"

      - name: Update JSON data
        run: |
          tmpfile=$(mktemp)
          jq --arg sha "$NICECORE_SHA" --arg size "$NICECORE_SIZE" \
            'map(if .name == "NiceC0re" then .sha256 = $sha | .size = $size else . end)' \
            assets/data/nicecore-versions.json > "$tmpfile"
          mv "$tmpfile" assets/data/nicecore-versions.json

          tmpfile=$(mktemp)
          jq --arg sha "$GOLDWING_SHA" --arg size "$GOLDWING_SIZE" \
            'map(if .name == "Latest (Goldwing)" then .sha256 = $sha | .size = $size else . end)' \
            assets/data/debian-versions.json > "$tmpfile"
          mv "$tmpfile" assets/data/debian-versions.json

      - name: Commit and push if changed
        run: |
          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- assets/data/nicecore-versions.json assets/data/debian-versions.json; then
            echo "Checksums and sizes unchanged, nothing to commit."
            exit 0
          fi

          git add assets/data/nicecore-versions.json assets/data/debian-versions.json
          git commit -m "Sync ISO checksums and sizes (NiceC0re, Goldwing)"
          git push origin HEAD:main

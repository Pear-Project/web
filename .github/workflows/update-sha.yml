name: Sync ISO checksums and sizes

# Daily pull of sha.txt from the two build repos (plus a live HEAD request
# for file size), plus a manual trigger for whenever this needs to be
# re-read on demand instead of waiting for the next midnight run.
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Fetch Goldwing checksum
        run: |
          # sha.txt is plain `sha256sum` output ("<hash>  <path>"), so the
          # hash is always the first whitespace-separated field regardless
          # of what filename/path follows it.
          goldwing_sha=$(curl -fsSL https://raw.githubusercontent.com/Pear-Project/iso/main/sha.txt | awk '{print $1}')

          if [ -z "$goldwing_sha" ]; then
            echo "[ ERR ]: Could not read Goldwing sha.txt from Pear-Project/iso."
            exit 1
          fi

          echo "Goldwing sha256: $goldwing_sha"
          echo "GOLDWING_SHA=$goldwing_sha" >> "$GITHUB_ENV"

      - name: Fetch Goldwing file size
        run: |
          # Re-check the size of whatever URL is currently listed -- a plain
          # HEAD request to iso.pearos.xyz, no auth needed (the Worker
          # returns content-length on HEAD regardless of the download being
          # paywalled/throttled for GET).
          goldwing_url=$(jq -r '.[] | select(.name == "Latest (Goldwing)") | .download' assets/data/debian-versions.json)
          goldwing_bytes=$(curl -fsSLI "$goldwing_url" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-length:/{print $2}' | tail -n1)

          if [ -z "$goldwing_bytes" ]; then
            echo "[ ERR ]: Could not read Goldwing content-length from $goldwing_url."
            exit 1
          fi

          goldwing_size=$(awk -v b="$goldwing_bytes" 'BEGIN{printf "%.1f GB", b/1000000000}')
          echo "Goldwing size: $goldwing_size ($goldwing_bytes bytes)"
          echo "GOLDWING_SIZE=$goldwing_size" >> "$GITHUB_ENV"

      - name: Rebuild changelog from each build repo's release notes
        run: |
          pip install --quiet markdown
          python3 .github/scripts/build_changelog.py

      - name: Sync NiceC0re (filename/sha/size, plus 15-day retirement of the previous ISO)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
        run: python3 .github/scripts/sync_nicecore_iso.py

      - name: Update Goldwing JSON data
        run: |
          tmpfile=$(mktemp)
          jq --arg sha "$GOLDWING_SHA" --arg size "$GOLDWING_SIZE" \
            'map(if .name == "Latest (Goldwing)" then .sha256 = $sha | .size = $size else . end)' \
            assets/data/debian-versions.json > "$tmpfile"
          mv "$tmpfile" assets/data/debian-versions.json

      - name: Commit and push if changed
        run: |
          git config user.name "pearOS build bot"
          git config user.email "327192259+pear-software@users.noreply.github.com"

          if git diff --quiet -- assets/data/nicecore-versions.json assets/data/debian-versions.json assets/data/changelog.json; then
            echo "Checksums, sizes, and changelog unchanged, nothing to commit."
            exit 0
          fi

          git add assets/data/nicecore-versions.json assets/data/debian-versions.json assets/data/changelog.json
          git commit -m "Sync ISO checksums, sizes, and changelog"
          # Other workflows commit to main independently -- retry with a
          # rebase instead of failing outright on a push collision.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          git push origin HEAD:main

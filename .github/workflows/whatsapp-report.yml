name: WhatsApp status report

# Fires whenever assets/data/download-stats.json actually changes (i.e. the
# daily stats-sync workflow just committed fresh numbers), not on every push
# to main -- otherwise every unrelated content commit would spam WhatsApp.
on:
  push:
    branches: [main]
    paths:
      - "assets/data/download-stats.json"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Give GitHub Pages a moment to redeploy the chart image
        run: sleep 20

      - name: Check site statuses
        run: |
          status_site() {
            curl -s --max-time 5 "$1" >/dev/null && echo "Online" || echo "Down"
          }
          echo "S1=$(status_site "https://pearos.xyz")" >> "$GITHUB_ENV"
          echo "S2=$(status_site "https://eqane.com")" >> "$GITHUB_ENV"
          echo "S3=$(status_site "https://itpgog-valcea.com")" >> "$GITHUB_ENV"
          echo "S4=$(status_site "https://alex.pearos.xyz")" >> "$GITHUB_ENV"
          echo "S5=$(status_site "https://pear-software.com")" >> "$GITHUB_ENV"
          echo "S6=$(status_site "https://crm.pear-software.com")" >> "$GITHUB_ENV"

      - name: Build message and send WhatsApp report
        env:
          WHATSER_APPKEY: ${{ secrets.WHATSER_APPKEY }}
          WHATSER_AUTHKEY: ${{ secrets.WHATSER_AUTHKEY }}
          WHATSER_TO: ${{ secrets.WHATSER_TO }}
        run: |
          MSG=$(python3 .github/scripts/build_whatsapp_message.py)
          echo "$MSG"

          curl --location --request POST "https://whatser.xyz/api/create-message" \
            --form "appkey=$WHATSER_APPKEY" \
            --form "authkey=$WHATSER_AUTHKEY" \
            --form "to=$WHATSER_TO" \
            --form "message=$MSG" \
            --form "file=https://pearos.xyz/assets/data/download-chart.png"
